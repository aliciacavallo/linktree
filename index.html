<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linktree Alicia Cavallo</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="icon" href="assets/img/favicon.ico" sizes="32x32" />
    <link rel="icon" href="assets/img/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div class="bubbles" aria-hidden="true">
      <span class="bubbles__bubble bubbles__bubble--lg"></span>
      <span class="bubbles__bubble bubbles__bubble--md"></span>
      <span class="bubbles__bubble bubbles__bubble--sm"></span>
    </div>
    <div class="page">
      <header class="profile">
        <img
          src="assets/img/avatar-alicia.webp"
          alt=""
          class="profile__avatar"
          width="112"
          height="112"
        />
        <h1 class="profile__name">Alicia Cavallo</h1>
        <p class="profile__bio">
          Je conçois des interfaces claires et accessibles, de la maquette au
          code.
        </p>
        <p class="status">Disponible · UI/UX et front</p>
      </header>
      <main class="page__main">
        <section class="link-group">
          <h2 class="link-group__title">Mon travail</h2>
          <ul class="link-group__list" role="list">
            <li>
              <a
                href="https://aliciacavallo.github.io/my-portfolio/"
                class="link-card link-card--featured"
                data-goatcounter-click="portfolio"
              >
                <span class="link-card__label">Voir mon portfolio</span>
              </a>
            </li>
            <li>
              <a
                href="https://github.com/aliciacavallo"
                class="link-card"
                data-goatcounter-click="github"
              >
                <span class="link-card__label">GitHub</span>
              </a>
            </li>
          </ul>
        </section>
        <section class="link-group">
          <h2 class="link-group__title">Me suivre ou me contacter</h2>
          <ul class="link-group__list" role="list">
            <li>
              <a
                href="https://www.linkedin.com/in/alicia-cavallo/"
                class="link-card"
                data-goatcounter-click="linkedin"
              >
                <span class="link-card__label">LinkedIn</span>
              </a>
            </li>
            <li>
              <a
                href="https://www.instagram.com/alicia._.cavallo/"
                class="link-card"
                data-goatcounter-click="instagram"
              >
                <span class="link-card__label">Instagram</span>
              </a>
            </li>
            <li>
              <a
                href="&#109;&#97;&#105;&#108;&#116;&#111;&#58;&#97;&#108;&#105;&#99;&#105;&#97;&#99;&#97;&#118;&#97;&#108;&#108;&#111;&#46;&#112;&#114;&#111;&#64;&#103;&#109;&#97;&#105;&#108;&#46;&#99;&#111;&#109;"
                class="link-card"
                data-goatcounter-click="email"
              >
                <span class="link-card__label">M'envoyer un mail</span>
              </a>
            </li>
          </ul>
        </section>
      </main>
      <footer class="page__footer">
        <p><small>© 2026 Alicia Cavallo</small></p>
      </footer>
    </div>
    <script
      data-goatcounter="https://aliciacavallo.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
    ></script>
  </body>
</html>
