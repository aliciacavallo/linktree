<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linktree Alicia Cavallo</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Work+Sans:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div class="bubbles" aria-hidden="true">
      <span class="bubbles__bubble bubbles__bubble--lg"></span>
      <span class="bubbles__bubble bubbles__bubble--md"></span>
      <span class="bubbles__bubble bubbles__bubble--sm"></span>
    </div>
    <div class="page">
      <header class="profile">
        <img
          src="assets/img/avatar-alicia.webp"
          alt="avatar d'Alicia Cavallo"
          class="profile__avatar"
          width="112"
          height="112"
        />
        <h1 class="profile__name">Alicia Cavallo</h1>
        <p class="profile__bio">
          Je conçois des interfaces claires et accessibles, de la maquette au
          code.
        </p>
        <p class="status">Disponible · UI/UX et front</p>
      </header>
      <main>
        <section class="link-group">
          <h2 class="link-group__title">Mon travail</h2>
          <ul class="link-group__list" role="list">
            <li>
              <a
                href="https://aliciacavallo.github.io/my-portfolio/"
                class="link-card link-card--featured"
              >
                <span class="link-card__label">Voir mon portfolio</span>
              </a>
            </li>
            <li>
              <a href="https://github.com/aliciacavallo" class="link-card">
                <span class="link-card__label">GitHub</span>
              </a>
            </li>
          </ul>
        </section>
        <section class="link-group">
          <h2 class="link-group__title">Me suivre ou me contacter</h2>
          <ul class="link-group__list" role="list">
            <li>
              <a
                href="https://www.linkedin.com/in/alicia-cavallo/"
                class="link-card"
              >
                <span class="link-card__label">LinkedIn</span>
              </a>
            </li>
            <li>
              <a
                href="https://www.instagram.com/alicia._.cavallo/"
                class="link-card"
              >
                <span class="link-card__label">Instagram</span>
              </a>
            </li>
            <li>
              <a
                href="mailto:aliciacavallo.pro[at]gmail[point]com"
                class="link-card"
              >
                <span class="link-card__label">M'envoyer un mail</span>
              </a>
            </li>
          </ul>
        </section>
      </main>
      <footer>
        <p><small>© 2026 Alicia Cavallo</small></p>
      </footer>
    </div>
  </body>
</html>
